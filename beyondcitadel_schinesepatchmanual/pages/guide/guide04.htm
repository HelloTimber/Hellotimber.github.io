<p><strong>补给物资</strong></p>
</div>
<div class="style3">
<hr>
</div>
<div class="style2">
<i><p>因为我们自己的存货也总是不够，</p>
<p>在出售的同时，我们也收购多余的补给物资。</p>
<p>如果您有多余的补给物资的话，就请卖给我们吧。</p></i>
<table border="1" align="center" cellpadding="10">
<thead>
<tr>
<th style="text-align: center;">补给物资</th>
<th style="text-align: center;">效果</th>
</tr>
</thead>
<tbody>
<tr>
<td><img  id="supply01"; src="../../images/tex_item_supply_medkit_box.png"; onclick="javascript:mPlay(&#39;bloodbag_sound&#39;);">&emsp;血袋</td>
<td>使用血袋能够补充损失的血液，但同时也会引起饥饿和中毒症状。</td>
</tr>
<tr>
<td><img  id="supply02"; src="../../images/tex_item_supply_o2canister_box.png"; onclick="javascript:mPlay(&#39;energy_canister_sound&#39;);">&emsp;氧气罐</td>
<td>氧气罐可以帮助殉教者快速恢复体力，并且可以消除输血导致的中毒症状。</td>
</tr>
<tr>
<td><img  id="supply03"; src="../../images/tex_item_supply_food_box.png"; onclick="javascript:mPlay(&#39;eat_food_sound&#39;);">&emsp;便携食物</td>
<td>便携食物可以为殉教者充饥，恢复生命值与体力的上限。</td>
</tr>

<script type="text/javascript">
function mPlay(s){
	if (!buzz.isSupported()) {
		$('body').append('<embed src="../../audio/' + s + '.ogg" autostart="true" hidden="true" loop="false">');
	} else {
		buzz.all().stop();
		var snd = new buzz.sound("../../audio/" + s, {formats: [ "ogg" ]});
		snd.play();
	}
}

function Text_MouseOver(thelabel) {
	document.getElementById(thelabel).style.color = "#FFFFFF";
}

function Text_MouseOut(thelabel) {
	document.getElementById(thelabel).style.color = "#000000";
}
</script>
