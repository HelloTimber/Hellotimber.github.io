<body style="background:#232323 url('../../images/bg00.jpg') no-repeat; color: #232323; background-position: bottom center; background-attachment: fixed; background-size: cover; cursor: url('../../images/tex_cursor_mouse_shadow.png'), default">

<div class="style1">
<br>
<p><strong>工作台</strong></p>
</div>
<div class="style3">
<hr>
</div>
<div class="style2">
<p>相较于前作，该作新增了武器改造系统，绝大多数武器都可在关卡场景中的工作台上进行改造。</p>
</div>
<center><IMG SRC="../../images/workbench.jpg"></center>
<div class="style2">
<p>游戏中大多数武器都有的改造选项可供选择，花费指定数量的金币即可解锁，如加装瞄准镜、安装加长弹仓等。</p>
<p>执行过的改造可以在工作台解除。</p>
</div>
<center><IMG SRC="../../images/workbench_rifle.jpg"></center>
<div class="style2">
<br>
<p>此外，工作台上还可以使用修理点数，恢复武器的耐久值。</p>
<p>修理点数通常会在击毁炮台类敌人时掉落，收集上限为200。</p>
</div>
<div class="style3"><hr></div>
<div class="style4">

<script type="text/javascript">
function mPlay(s){
	if (!buzz.isSupported()) {
		$('body').append('<embed src="../../audio/' + s + '.ogg" autostart="true" hidden="true" loop="false">');
	} else {
		var snd = new buzz.sound("../../audio/" + s, {formats: [ "ogg" ]});
		snd.play();
	}
}

function Text_MouseOver(thelabel) {
	document.getElementById(thelabel).style.color = "#FFFFFF";
}

function Text_MouseOut(thelabel) {
	document.getElementById(thelabel).style.color = "#000000";
}
</script>
