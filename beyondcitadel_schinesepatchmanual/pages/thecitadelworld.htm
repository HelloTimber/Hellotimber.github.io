<script type="text/javascript">
function mPlay(s){
	if (!buzz.isSupported()) {
		$('body').append('<embed src="../audio/' + s + '.ogg" autostart="true" hidden="true" loop="false">');
	} else {
		var snd = new buzz.sound("../audio/" + s, {formats: [ "ogg" ]});
		snd.play();
	}
}

function Text_MouseOver(thelabel) {
	document.getElementById(thelabel).style.color = "#FFFFFF";
}

function Text_MouseOut(thelabel) {
	document.getElementById(thelabel).style.color = "#000000";
}
</script>
