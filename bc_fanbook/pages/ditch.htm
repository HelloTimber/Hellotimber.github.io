function playbgm()
{
	javascript:mPlay("I_have_always_loved_you")
	setTimeout("playbgm()",100000);
}
function mPlay(s){
	if (!buzz.isSupported()) {
		$('body').append('<embed src="../audio/' + s + '.ogg" autostart="true" hidden="true" loop="false">');
	} else {
		var snd = new buzz.sound("../audio/" + s, {formats: [ "ogg" ]});
		snd.play();
	}
}
