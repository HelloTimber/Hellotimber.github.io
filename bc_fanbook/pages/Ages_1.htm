function getCurrentPageNumber() {
    try {
        const path = window.location.pathname;
		const PageNumber = window.location.pathname.split('/').pop().split('.')[0].split('_').pop();
        return PageNumber || '0';
    } catch (e) {
        console.error("获取页面名称失败:", e);
        return '';
    }
}

fetch('pageheader_a.htm')
  .then(response => response.text())
  .then(data => {
    document.getElementById('pageheader_a').innerHTML = data;
	document.getElementById('TextBox_JumpTo_').placeholder = getCurrentPageNumber();
	document.getElementById('pageprefix_').innerText = window.location.pathname.split('/').pop().split('.')[0].split('_')[0];
	const form_a = document.getElementById('TextBoxForm_');
	form_a.addEventListener('submit', function(event) {
		event.preventDefault(); 
		const value = document.getElementById('TextBox_JumpTo_').value;
		JumpToPage(value);

function NextPage(i) {
	console.log(window.location.pathname);
	const PageNumber = window.location.pathname.split('/').pop().split('.')[0].split('_').pop();
	var PageNum = Number(PageNumber);
	console.log(PageNumber);
	console.log(PageNum);
	PageNum = PageNum+i;
	var strPageNum = String(PageNum);
	JumpToPage(strPageNum);
}

function JumpToPage(PageNum){
	const PagePrefix = window.location.pathname.split('/').pop().split('.')[0].split('_')[0];
	console.log(PageNum);
	var TargetPage = PagePrefix+'_'+PageNum+'.htm';
	console.log(TargetPage);
	checkPageExists(TargetPage).then(exists => {
		if (exists) {
			parent.DITCH.mPlay('ui_ok');
			window.location.href = TargetPage;
		} else {
			parent.DITCH.mPlay('ui_cancel');
		}
	});
}

async function checkPageExists(url) {
    try {
        const response = await fetch(url, { method: 'HEAD' });
        // 200-299 之间的状态码都表示请求成功（页面存在）
        return response.ok; 
    } catch (error) {
        // 网络错误、跨域拦截等情况会进入这里
        console.error("检查页面失败:", error);
        return false;
    }
}
